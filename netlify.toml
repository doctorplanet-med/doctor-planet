[build]
  command = "npm run build"
  # Must be .next (not the repo root) — overrides the UI setting.
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  # Firebase web API key is public by design and is inlined into client JS.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_FIREBASE_API_KEY"

[[plugins]]
  package = "@netlify/plugin-nextjs"
